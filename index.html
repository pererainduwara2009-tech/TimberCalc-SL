<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="index.css">
</head>
<body>
    
    <header>
        <img src="logo.png" alt="logo">
    </header>

    <main>

        <section class="saved-line">
            <article>
                <div class="saved-line">
                    <h3>Auto-saved<br>
                    <span>bill saved on this device</span></h3>
                </div>
                <button>View Bill</button>
            </article>
        </section>

        <section class="edit-area">

            <div class="input">

                <div class="topic">
                    <h2>Add Timber Item</h2>
                    <button>Clear</button>
                </div>

                <div class="selecter">
                    <label for="" class="li-label">1.Select timber type</label>
                    <select name="Wood-type" id="wood-type">
                        <option value="teak">Teak</option>
                        <option value="maogani">Maogani</option>
                    </select>
                </div>

                <div class="inputs">

                    <div class="length-and-width">

                        <div class="length-area">
                            <label for="" class="li-label">2.Length (ft)</label>
                            <input type="number" class="length" id="length">
                        </div>

                        <div class="width-area">
                            <label for="" class="li-label">3.Width (in)</label>
                            <input type="number" class="width" id="width">
                        </div>

                    </div>

                    <div class="thickness-and-quantity">

                        <div class="thickness-area">
                            <label for="" class="li-label">4.Thickness (in)</label>
                            <input type="number" class="thickness">
                        </div>
                    </div>
                </div>

            </div>

        </section>

    </main>

</body>
</html>
