<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="index.css">
</head>
<body>
    
    <header>
        <img src="logo.png" alt="logo">
    </header>

    <main>

         <section class="container">

        <section class="edit-area">

            <div class="input">
             
                <div class="topic">
                  <button id="see-area-button" onclick="show()"> 
                   <div>
                      <div class="selecter">
                       <select name="Wood-type" id="wood-type">
                          <option value="teak">Teak</option>
                          <option value="maogani">Maogani</option>
                       </select>
                       <input type="number" id="price">
                      </div>
                   </div>
                    </button>
                    <div class="see-area" id="see-area">
                        <button id="done" onclick="off()">Done</button>
                    </div>
                </div>
               

                

                <div class="inputs">

                    <div class="length-and-width">

                        <div class="length-area">
                            <label for="" class="li-label">2.Length (in)</label>
                            <input type="number" class="length" id="length">
                        </div>

                        <div class="width-area">
                            <label for="" class="li-label">3.Width (in)</label>
                            <input type="number" class="width" id="width">
                        </div>

                    </div>

                    <div class="thickness-and-quantity">

                        <div class="thickness-area">
                            <label for="" class="li-label">4.Thickness (in)</label>
                            <input type="number" class="thickness">

                            <button onclick="calculation()">cals</button>
                        </div>
                    </div>
                </div>

            </div>

        </section>

        </section>

        <section class="num-pad" id="num-pad">
            <div>
                <table>
                    <tr>
                        <td><button class="btn">7</button></td>
                        <td><button class="btn">8</button></td>
                        <td><button class="btn">9</button></td>
                        <td><button class="btn" id="c">c</button></td>
                    </tr>
                    <tr>
                        <td><button class="btn">4</button></td>
                        <td><button class="btn">5</button></td>
                        <td><button class="btn">6</button></td>
                        
                    </tr>
                    <tr>
                        <td><button class="btn">1</button></td>
                        <td><button class="btn">2</button></td>
                        <td><button class="btn">3</button></td>
                        <td colspan="2" class="btn" id="e-btn"><button>E</button></td>
                    </tr>
                </table>
            </div>
        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
